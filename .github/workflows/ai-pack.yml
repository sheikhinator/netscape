name: Build Netscape AI pack

# Downloads the offline AI models from their official sources, converts them for phones,
# checks them against the originals (Python) and against the app's own Kotlin code, then
# publishes Netscape-AI-Pack.zip as a release you can download on your phone.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/ai/**'
      - '.github/workflows/ai-pack.yml'

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install converters
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
          pip install transformers==4.44.2 onnx==1.16.2 onnxruntime==1.19.2 \
            nudenet==3.4.2 pillow numpy ftfy regex

      - name: Build and verify models (Python)
        run: python tools/ai/build_ai_pack.py out

      - name: Unpack app source
        run: |
          mkdir -p _unpacked
          unzip -q Netscape-source.zip -d _unpacked
          echo "AI_SRC=$PWD/$(dirname "$(find _unpacked -path '*/com/netscape/vault/ai/Engines.kt' | head -n 1)")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Verify the app's Kotlin AI code against the pack
        working-directory: tools/ai/harness
        run: |
          gradle installDist --no-daemon -q -PaiSrc="$AI_SRC"
          build/install/aiharness/bin/aiharness pack ../../../out/pack ../../../out/ref.json ../../../out/testimgs

      - name: Publish release and verify the uploaded file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="ai-pack-v1"
          SHA=$(cut -d' ' -f1 out/pack.sha256)
          SIZE=$(stat -c %s out/Netscape-AI-Pack.zip)
          MB=$(awk "BEGIN { printf \"%.1f\", $SIZE / 1000000 }")
          NOTES="Offline AI models for Netscape.

          1. Download Netscape-AI-Pack.zip on your phone and wait until the download has completely finished.
          2. In the app: Settings → AI models → Install AI pack, and pick the zip.

          The file is ${MB} MB (${SIZE} bytes). SHA-256: ${SHA}
          The app checks every model inside it; if it says the pack is damaged, delete the download and get it again.

          Built from commit ${{ github.sha }}."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Netscape AI pack" --notes "$NOTES"
          gh release upload "$TAG" out/Netscape-AI-Pack.zip --clobber
          gh release edit "$TAG" --notes "$NOTES"
          # Download what GitHub actually serves and make sure it is byte-identical.
          gh release download "$TAG" -p Netscape-AI-Pack.zip -O published.zip --clobber
          echo "$SHA  published.zip" | sha256sum -c -
          python -c "import zipfile,sys; z=zipfile.ZipFile('published.zip'); bad=z.testzip(); sys.exit(f'corrupt entry {bad}' if bad else 0)"
          echo "Published pack verified: $MB MB, sha256 $SHA"
