name: Build Netscape APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project zip
        id: unpack
        run: |
          set -e
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "No .zip found in the repo root — using the repo contents as-is."
            PROJECT_ROOT="$PWD"
          else
            echo "Unpacking $ZIP"
            mkdir -p _unpacked
            unzip -q "$ZIP" -d _unpacked
            PROJECT_ROOT=$(dirname "$(find _unpacked -name settings.gradle.kts -o -name settings.gradle | head -n 1)")
          fi
          if [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ] && [ ! -f "$PROJECT_ROOT/settings.gradle" ]; then
            echo "Could not find a Gradle project (settings.gradle.kts)." >&2
            exit 1
          fi
          echo "Project root: $PROJECT_ROOT"
          echo "dir=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy "tools" package, which newer
          # sdkmanager versions no longer provide — that breaks this step.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Build debug APK
        working-directory: ${{ steps.unpack.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -e
          APK=$(find "${{ steps.unpack.outputs.dir }}" -path "*/outputs/apk/debug/*.apk" | head -n 1)
          mkdir -p out
          cp "$APK" out/Netscape.apk
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Netscape-APK
          path: out/Netscape.apk
          if-no-files-found: error

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" out/Netscape.apk \
            --title "Netscape $TAG" \
            --notes "Debug APK built from commit ${{ github.sha }}. Tap the .apk below to install." \
            || gh release upload "$TAG" out/Netscape.apk --clobber
